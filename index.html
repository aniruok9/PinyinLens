<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Pinyin Lens</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="coi-serviceworker.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #loading-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; color: #fff; font-family: system-ui, sans-serif;
    }
    #loading-screen h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    #loading-screen .progress-bar {
      width: 80%; max-width: 300px; height: 6px;
      background: #333; border-radius: 3px; overflow: hidden;
    }
    #loading-screen .progress-fill {
      height: 100%; width: 0%; background: #4fc3f7; transition: width 0.3s;
    }
    #loading-screen .status { margin-top: 0.75rem; font-size: 0.85rem; color: #aaa; }
    #camera-canvas {
      display: block; width: 100%; height: 100%; object-fit: contain;
      touch-action: none;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>Pinyin Lens</h1>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="status" id="loading-status">Initializing...</div>
  </div>

  <canvas id="camera-canvas"></canvas>

  <video id="camera-video" playsinline autoplay muted style="display:none;"></video>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
