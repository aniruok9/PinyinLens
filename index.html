<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Pinyin Lens</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="coi-serviceworker.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #loading-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; color: #fff; font-family: system-ui, sans-serif;
    }
    #loading-screen h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    #loading-screen .progress-bar {
      width: 80%; max-width: 300px; height: 6px;
      background: #333; border-radius: 3px; overflow: hidden;
    }
    #loading-screen .progress-fill {
      height: 100%; width: 0%; background: #4fc3f7; transition: width 0.3s;
    }
    #loading-screen .status { margin-top: 0.75rem; font-size: 0.85rem; color: #aaa; }
    #camera-container {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000; transform-origin: center center; touch-action: none;
    }
    #camera-video {
      display: block; width: 100%; height: 100%; object-fit: contain;
    }
    #camera-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      touch-action: none;
    }
    #shutter-btn {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 50; width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: 3px solid rgba(255, 255, 255, 0.8);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #shutter-btn:active { background: rgba(255, 255, 255, 0.4); }
    #shutter-btn[disabled] { opacity: 0.5; pointer-events: none; }
    #shutter-spinner {
      width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>Pinyin Lens</h1>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="status" id="loading-status">Initializing...</div>
  </div>

  <div id="camera-container">
    <video id="camera-video" playsinline autoplay muted></video>
    <canvas id="camera-canvas"></canvas>
  </div>

  <button id="shutter-btn" type="button" aria-label="Pause camera">
    <svg id="shutter-icon-pause" viewBox="0 0 24 24" width="32" height="32" fill="white">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="shutter-icon-play" class="hidden" viewBox="0 0 24 24" width="32" height="32" fill="white">
      <polygon points="6,4 20,12 6,20"/>
    </svg>
    <div id="shutter-spinner" class="hidden"></div>
  </button>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
