<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Pinyin Lens</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="coi-serviceworker.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #loading-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(ellipse at top, #1a2332 0%, #000 70%);
      color: #fff; font-family: system-ui, -apple-system, sans-serif;
      overflow-y: auto;
    }
    .loading-inner {
      display: flex; flex-direction: column; align-items: center;
      max-width: 360px; width: 100%;
    }
    .logo {
      width: 96px; height: 96px; margin-bottom: 1.25rem;
      filter: drop-shadow(0 0 24px rgba(79, 195, 247, 0.35));
    }
    #loading-screen h1 {
      font-size: 2rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #4fc3f7 0%, #e91e63 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      margin-bottom: 0.35rem;
    }
    #loading-screen .tagline {
      font-size: 0.9rem; color: #9aa4b2; margin-bottom: 2rem;
      text-align: center;
    }
    .how-to {
      width: 100%; margin-bottom: 2rem;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .step {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-size: 0.85rem; color: #cfd6e0;
    }
    .step-num {
      flex-shrink: 0;
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg, #4fc3f7, #e91e63);
      color: #000; font-weight: 700; font-size: 0.75rem;
      display: flex; align-items: center; justify-content: center;
    }
    #loading-screen .progress-bar {
      width: 100%; height: 6px;
      background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden;
    }
    #loading-screen .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #4fc3f7, #e91e63);
      transition: width 0.3s;
    }
    #loading-screen .status {
      margin-top: 0.75rem; font-size: 0.8rem; color: #7a828e;
      text-align: center; min-height: 1em;
    }
    #start-btn {
      margin-top: 1.5rem;
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #4fc3f7, #e91e63);
      border: 3px solid rgba(255, 255, 255, 0.9);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; color: #000;
      box-shadow: 0 0 32px rgba(79, 195, 247, 0.4);
      transition: transform 0.15s, opacity 0.2s;
    }
    #start-btn:active { transform: scale(0.95); }
    #start-btn[disabled] {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: none;
      cursor: not-allowed; opacity: 0.6;
    }
    #start-btn svg { width: 32px; height: 32px; }
    #camera-container {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000; transform-origin: center center; touch-action: none;
    }
    #camera-video {
      display: block; width: 100%; height: 100%; object-fit: contain;
    }
    #camera-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      touch-action: none;
    }
    #shutter-btn {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 50; width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: 3px solid rgba(255, 255, 255, 0.8);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #shutter-btn:active { background: rgba(255, 255, 255, 0.4); }
    #shutter-btn[disabled] { opacity: 0.5; pointer-events: none; }
    #shutter-spinner {
      width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-inner">
      <svg class="logo" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4fc3f7"/>
            <stop offset="100%" stop-color="#e91e63"/>
          </linearGradient>
        </defs>
        <circle cx="48" cy="48" r="42" fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
        <circle cx="48" cy="48" r="30" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
        <text x="48" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="url(#logoGrad)" font-family="system-ui, sans-serif">文</text>
        <text x="48" y="76" text-anchor="middle" font-size="9" font-weight="600" fill="#9aa4b2" font-family="system-ui, sans-serif" letter-spacing="1">wén</text>
      </svg>
      <h1>Pinyin Lens</h1>
      <div class="tagline">Read Chinese with your camera — pinyin overlaid on every character.</div>

      <div class="how-to">
        <div class="step"><span class="step-num">1</span><span>Point your camera at Chinese text</span></div>
        <div class="step"><span class="step-num">2</span><span>Tap the shutter to freeze &amp; scan</span></div>
        <div class="step"><span class="step-num">3</span><span>Pinch to zoom, drag to pan — tap again to resume</span></div>
      </div>

      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="status" id="loading-status">Initializing...</div>

      <button id="start-btn" type="button" disabled aria-label="Start">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="6,4 20,12 6,20"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="camera-container">
    <video id="camera-video" playsinline autoplay muted></video>
    <canvas id="camera-canvas"></canvas>
  </div>

  <button id="shutter-btn" type="button" aria-label="Pause camera">
    <svg id="shutter-icon-pause" viewBox="0 0 24 24" width="32" height="32" fill="white">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="shutter-icon-play" class="hidden" viewBox="0 0 24 24" width="32" height="32" fill="white">
      <polygon points="6,4 20,12 6,20"/>
    </svg>
    <div id="shutter-spinner" class="hidden"></div>
  </button>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
